# Staging da Fictitur: Postgres com o modelo relacional (DDL aplicado no 1º boot).
# Uso: copie ../.env.example para ../.env, ajuste se quiser, e rode `docker compose up -d`.
name: fictitur-staging

services:
  postgres:
    image: postgres:16-alpine
    container_name: fictitur_staging_postgres
    environment:
      POSTGRES_DB: ${STAGING_DB:-db_fictitur}
      POSTGRES_USER: ${STAGING_USER:-fictitur}
      POSTGRES_PASSWORD: ${STAGING_PASSWORD:?defina STAGING_PASSWORD no .env}
    ports:
      - "${STAGING_PORT:-5433}:5432"
    volumes:
      - staging_pgdata:/var/lib/postgresql/data
      - ./ddl:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STAGING_USER:-fictitur} -d ${STAGING_DB:-db_fictitur}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Warehouse multidimensional (fase D): o star schema da gold servido em Postgres,
  # para dashboards e Power BI. Nasce vazio; `uv run carga-dw` popula por partição.
  warehouse:
    image: postgres:16-alpine
    container_name: fictitur_warehouse_postgres
    environment:
      POSTGRES_DB: ${DW_DB:-dw_fictitur}
      POSTGRES_USER: ${DW_USER:-fictitur}
      POSTGRES_PASSWORD: ${DW_PASSWORD:?defina DW_PASSWORD no .env}
    ports:
      - "${DW_PORT:-5434}:5432"
    volumes:
      - warehouse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DW_USER:-fictitur} -d ${DW_DB:-dw_fictitur}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  staging_pgdata:
  warehouse_pgdata:
